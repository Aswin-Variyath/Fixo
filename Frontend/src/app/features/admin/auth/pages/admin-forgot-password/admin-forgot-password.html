<main
  class="relative flex min-h-screen w-full items-center justify-center bg-deep-navy px-margin-mobile"
>
  <div class="relative z-10 w-full max-w-[480px]">
    <!-- Glassmorphism Card -->
    <div
      class="glass-card glow-shadow-primary bg-deep-navy/70 backdrop-blur-[30px] rounded-[20px] border border-glass-stroke p-8 md:p-10 relative overflow-hidden"
    >
      <!-- Inner Border Highlight -->
      <div class="absolute inset-0 rounded-[20px] border border-white/5 pointer-events-none"></div>

      <!-- Header -->
      <div class="text-center mb-8 relative z-10">
        <h1
          class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg bg-gradient-to-r from-royal-blue to-sky-blue bg-clip-text text-transparent tracking-tight mb-4"
        >
          Admin Portal
        </h1>

        <h2
          class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg font-bold text-on-surface mb-stack-sm"
        >
          Forgot Password
        </h2>

        <p class="font-body-md text-body-md text-on-surface-variant">
          Enter your admin email address and we'll send you a secure password reset link.
        </p>
      </div>

      <!-- Form -->
      <form class="space-y-6 relative z-10">
        <!-- Email Field -->
        <div class="space-y-stack-sm">
          <label
            class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider block"
            for="email"
          >
            Admin Email Address
          </label>

          <div class="relative group">
            <div
              class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-sky-blue transition-colors"
            >
              <span class="material-symbols-outlined"> mail </span>
            </div>

            <input
              id="email"
              name="email"
              type="email"
              placeholder="admin@fixo.com"
              required
              class="w-full bg-[#0a0f18] border border-outline-variant rounded-xl py-3 pl-12 pr-4 text-on-surface font-body-md text-body-md placeholder-on-surface-variant/50 focus:outline-none focus:border-sky-blue focus:ring-1 focus:ring-sky-blue transition-all"
            />
          </div>
        </div>

        <!-- Primary Button -->
        <button type="button" class="w-full relative group mt-8">
          <div
            class="absolute -inset-1 rounded-full bg-gradient-to-r from-royal-blue to-sky-blue blur opacity-40 group-hover:opacity-70 transition duration-200"
          ></div>

          <div
            class="relative w-full bg-gradient-to-r from-royal-blue to-sky-blue text-white rounded-full py-4 px-6 font-body-md text-body-md font-semibold flex items-center justify-center gap-2 hover:scale-[1.02] transition-transform shadow-glow"
          >
            Send Reset Link

            <span class="material-symbols-outlined text-sm"> arrow_forward </span>
          </div>
        </button>
      </form>

      <!-- Back to Login -->
      <div class="mt-8 text-center relative z-10">
        <a
          href="#"
          class="font-body-md text-body-md text-on-surface-variant hover:text-sky-blue transition-colors inline-flex items-center gap-2 group"
        >
          <span
            class="material-symbols-outlined text-sm group-hover:-translate-x-1 transition-transform"
          >
            arrow_back
          </span>

          Back to Login
        </a>
      </div>
    </div>
  </div>
</main>
