<main
  class="relative flex min-h-screen items-center justify-center bg-deep-navy px-margin-mobile"
>
  <div class="w-full max-w-md">
    <div
      class="glass-card glow-shadow-primary relative overflow-hidden rounded-[20px] p-8 md:p-10"
    >
      <!-- Inner Border -->
      <div
        class="absolute inset-0 rounded-[20px] border border-white/5 pointer-events-none"
      ></div>

         <header class="flex flex-col items-center text-center gap-stack-sm relative z-10">
      <h1
        class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg bg-gradient-to-r from-royal-blue to-sky-blue bg-clip-text text-transparent tracking-tight"
      >
        Admin Portal
      </h1>

      <div
        class="w-16 h-16 bg-gradient-to-br from-royal-blue to-sky-blue rounded-full mb-4 flex items-center justify-center shadow-accent-glow p-[1px]"
      >
        <div
          class="w-full h-full bg-deep-navy/90 rounded-full flex items-center justify-center backdrop-blur-md"
        >
          <span
            class="material-symbols-outlined text-primary text-[32px] font-light"
            style="font-variation-settings: 'FILL' 0"
          >
            lock_reset
          </span>
        </div>
      </div>

      <h2
        class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface tracking-tight"
      >
        Reset Password
      </h2>

     
    </header>
    <!-- Form Section -->
    <form action="#" class="flex flex-col gap-stack-md relative z-10" method="POST">
      <!-- New Password Field -->
      <div class="flex flex-col gap-2">
        <label
          class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider"
          for="new-password"
          >New Password</label
        >
        <div class="relative group">
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
            <span
              class="material-symbols-outlined text-outline-variant group-focus-within:text-primary transition-colors duration-300"
              >lock</span
            >
          </div>
          <input
            class="w-full bg-surface-container-low border border-glass-stroke rounded-lg py-3 pl-12 pr-4 text-on-surface font-body-md text-body-md placeholder:text-outline-variant focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary focus:bg-surface-container-highest transition-all duration-300"
            id="new-password"
            name="new-password"
            placeholder="Enter new password"
            required=""
            type="password"
          />
        </div>
      </div>
      <!-- Confirm Password Field -->
      <div class="flex flex-col gap-2">
        <label
          class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider"
          for="confirm-password"
          >Confirm Password</label
        >
        <div class="relative group">
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
            <span
              class="material-symbols-outlined text-outline-variant group-focus-within:text-primary transition-colors duration-300"
              >lock</span
            >
          </div>
          <input
            class="w-full bg-surface-container-low border border-glass-stroke rounded-lg py-3 pl-12 pr-4 text-on-surface font-body-md text-body-md placeholder:text-outline-variant focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary focus:bg-surface-container-highest transition-all duration-300"
            id="confirm-password"
            name="confirm-password"
            placeholder="Confirm new password"
            required=""
            type="password"
          />
        </div>
      </div>
      <!-- Submit Button -->
      <button
        class="mt-4 w-full bg-gradient-to-r from-royal-blue to-sky-blue text-white rounded-full py-4 font-body-md text-body-md font-semibold hover:scale-[1.02] active:scale-[0.98] transition-all duration-300 relative group overflow-hidden"
        type="submit"
      >
        <span class="relative z-10 flex items-center justify-center gap-2">
          Reset Password
          <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
        </span>
        <!-- Hover Glow Shadow -->
        <div
          class="absolute inset-0 bg-white/20 opacity-0 group-hover:opacity-100 transition-opacity duration-300 z-0"
        ></div>
      </button>
    </form>
    <!-- Footer Links -->
    <div class="text-center mt-2 relative z-10">
      <a
        class="font-body-md text-body-md text-on-surface-variant hover:text-sky-blue transition-colors duration-300 inline-flex items-center gap-1 group"
        href="#"
      >
        <span
          class="material-symbols-outlined text-[16px] group-hover:-translate-x-1 transition-transform duration-300"
          >arrow_back</span
        >
        Back to Login
      </a>
    </div>

    </div>
  </div>
</main>
