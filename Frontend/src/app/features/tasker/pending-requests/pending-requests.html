<app-navbar />

<!-- Ambient Glow Background -->
<div class="ambient-glow" aria-hidden="true"></div>

<!-- Abstract Background Elements from Stitch -->
<div class="fixed inset-0 pointer-events-none z-[-1] overflow-hidden" aria-hidden="true">
  <div class="absolute top-[-10%] left-[-10%] w-[50vw] h-[50vw] bg-royal-blue/10 rounded-full blur-[120px] mix-blend-screen"></div>
  <div class="absolute bottom-[-20%] right-[-10%] w-[60vw] h-[60vw] bg-sky-blue/5 rounded-full blur-[150px] mix-blend-screen"></div>
</div>

@if (isEmptyState()) {
  <!-- STATE 1: Empty Pending Requests (Stitch Design) -->
  <main class="flex-grow pt-[120px] pb-section-gap px-margin-mobile md:px-gutter max-w-container-max mx-auto w-full flex flex-col justify-center items-center min-h-[calc(100vh-200px)]">
    <app-pending-requests-empty (refresh)="toggleState()" />
  </main>
} @else {
  <!-- STATE 2: Pending Requests List (Stitch Design) -->
  <main class="flex-grow pt-32 pb-section-gap px-margin-mobile md:px-gutter max-w-container-max mx-auto w-full">
    <!-- Header Section -->
    <app-pending-requests-header [count]="5" />

    <!-- Toolbar Section -->
    <app-pending-requests-toolbar />

    <!-- Request List -->
    <div class="flex flex-col gap-4 relative z-0">
      <!-- Card 1 -->
      <app-pending-request-card [request]="card1" />

      <!-- Card 2 -->
      <app-pending-request-card [request]="card2" />

      <!-- 3 More Requests Indicator from Stitch Reference -->
      <div class="glass-panel rounded-2xl p-6 opacity-60 flex justify-center items-center h-32 border-dashed">
        <p class="text-on-surface-variant flex items-center gap-2">
          <span class="material-symbols-outlined" data-icon="more_horiz">more_horiz</span>
          3 more requests loaded below
        </p>
      </div>
    </div>
  </main>
}

<app-footer />
