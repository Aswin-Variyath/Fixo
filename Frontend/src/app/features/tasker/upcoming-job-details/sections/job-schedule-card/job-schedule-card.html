<div class="glass-panel rounded-2xl p-6">
  <h3
    class="font-body-xl text-body-xl font-semibold text-on-background mb-6 flex items-center gap-2"
  >
    <span class="material-symbols-outlined text-primary">event</span> Job Schedule
  </h3>
  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    <!-- Date -->
    <div class="flex items-start gap-3">
      <div class="mt-1 text-on-surface-variant">
        <span class="material-symbols-outlined">calendar_today</span>
      </div>
      <div>
        <div
          class="font-label-sm text-label-sm text-on-surface-variant mb-1 uppercase tracking-wider"
        >
          Date
        </div>
        <div class="font-body-md text-body-md text-on-background">August 25, 2026</div>
      </div>
    </div>
    <!-- Start Time -->
    <div class="flex items-start gap-3">
      <div class="mt-1 text-on-surface-variant">
        <span class="material-symbols-outlined">schedule</span>
      </div>
      <div>
        <div
          class="font-label-sm text-label-sm text-on-surface-variant mb-1 uppercase tracking-wider"
        >
          Start Time
        </div>
        <div class="font-body-md text-body-md text-on-background">10:00 AM</div>
      </div>
    </div>
    <!-- Duration -->
    <div class="flex items-start gap-3">
      <div class="mt-1 text-on-surface-variant">
        <span class="material-symbols-outlined">hourglass_empty</span>
      </div>
      <div>
        <div
          class="font-label-sm text-label-sm text-on-surface-variant mb-1 uppercase tracking-wider"
        >
          Estimated Duration
        </div>
        <div class="font-body-md text-body-md text-on-background">3 hours</div>
      </div>
    </div>
  </div>
</div>
