<div class="glass-panel rounded-2xl p-6 flex flex-col gap-4">
  <!-- Primary: Start Job -->
  <button
    type="button"
    class="w-full py-4 rounded-full bg-gradient-primary text-white font-body-md text-body-md font-semibold flex items-center justify-center gap-2 hover-scale shadow-[0_0_20px_rgba(94,106,210,0.3)] cursor-pointer"
  >
    <span
      class="material-symbols-outlined"
      style="font-variation-settings: 'FILL' 1"
      >play_arrow</span
    >
    Start Job
  </button>
  <p class="text-center font-label-sm text-label-sm text-on-surface-variant">
    You can start the job when you arrive at the customer's location.
  </p>
  <!-- Secondary: Message Customer -->
  <button
    type="button"
    class="w-full py-4 rounded-full bg-transparent border border-glass-stroke text-on-background font-body-md text-body-md hover:bg-surface-variant transition-colors flex items-center justify-center gap-2 cursor-pointer"
  >
    <span class="material-symbols-outlined">chat</span>
    Message Customer
  </button>
</div>

<!-- Pre-Start Notice -->
<div
  class="p-4 rounded-xl bg-primary-container/10 border border-primary/20 flex gap-3 items-start glass-panel mt-0"
>
  <span class="material-symbols-outlined text-primary mt-0.5">notification_important</span>
  <p class="font-label-sm text-label-sm text-on-surface-variant leading-relaxed">
    <strong class="text-primary font-medium">Before starting:</strong> Confirm that you
    have reached the customer's location and reviewed the requested work.
  </p>
</div>
