<main class="relative z-10 flex min-h-screen w-full items-center justify-center px-margin-mobile">
  <!-- Premium Glassmorphism Card -->
  <div
    class="w-full max-w-md bg-deep-navy/70 backdrop-blur-[30px] border border-glass-stroke rounded-[20px] p-8 md:p-10 shadow-accent-glow relative overflow-hidden"
  >
    <!-- Inner Glass Highlight -->
    <div class="absolute inset-0 border border-white/5 rounded-[20px] pointer-events-none"></div>
    <!-- Header Section -->
    <div class="text-center mb-8">
      <!-- Fixo Logo Mark (Optional, adds premium feel) -->
      <h1
        class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-3 tracking-tight"
      >
        Forgot Password
      </h1>
      <p class="text-on-surface-variant font-body-md text-body-md max-w-sm mx-auto">
        Enter your registered email address and we'll send you a secure password reset link.
      </p>
    </div>
    <!-- Form Form -->
    <form action="#" class="space-y-6" method="POST">
      <!-- Email Field -->
      <div class="space-y-stack-sm group">
        <label class="block font-label-sm text-label-sm text-on-surface-variant" for="email"
          >Email Address</label
        >
        <div class="relative">
          <div
            class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-outline group-focus-within:text-primary transition-colors duration-200"
          >
            <span class="material-symbols-outlined text-xl">mail</span>
          </div>
          <input
            class="block w-full pl-11 pr-4 py-3 bg-surface-dim border border-outline-variant rounded-xl text-on-surface placeholder:text-outline-variant focus:ring-1 focus:ring-primary focus:border-primary transition-all duration-200 shadow-inner bg-opacity-50 backdrop-blur-sm"
            id="email"
            name="email"
            placeholder="name@example.com"
            required=""
            type="email"
          />
        </div>
      </div>
      <!-- Action Button -->
      <button
        class="w-full flex items-center justify-center py-4 px-6 rounded-full bg-gradient-to-r from-royal-blue to-sky-blue text-white font-body-md font-semibold text-body-md hover:scale-[1.02] hover:shadow-accent-glow active:scale-95 transition-all duration-200"
        type="submit"
      >
        Send Reset Link
        <span class="material-symbols-outlined ml-2 text-xl">arrow_forward</span>
      </button>
    </form>
    <!-- Footer Link -->
    <div class="mt-8 text-center">
      <a
        class="inline-flex items-center text-on-surface-variant hover:text-primary transition-colors duration-200 font-label-sm text-label-sm uppercase tracking-widest group"
        href="#"
      >
        <span
          class="material-symbols-outlined text-sm mr-2 group-hover:-translate-x-1 transition-transform"
          >arrow_back</span
        >
        Back to Login
      </a>
    </div>
  </div>
</main>
