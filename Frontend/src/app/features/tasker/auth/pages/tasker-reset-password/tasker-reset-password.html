<main
  class="bg-surface-container-lowest text-on-surface min-h-screen flex items-center justify-center ambient-bg p-margin-mobile relative overflow-hidden"
>
  <!-- Abstract Background Elements -->
  <div class="absolute inset-0 pointer-events-none overflow-hidden">
    <div
      class="absolute top-[20%] left-[10%] w-96 h-96 bg-primary-container/20 rounded-full blur-[100px] mix-blend-screen"
    ></div>
    <div
      class="absolute bottom-[20%] right-[10%] w-[500px] h-[500px] bg-sky-blue/10 rounded-full blur-[120px] mix-blend-screen"
    ></div>
  </div>
  <!-- Main Glass Card -->
  <div
    class="glass-card rounded-[24px] w-full max-w-md p-8 md:p-10 relative z-10 animate-fade-in-up"
  >
    <!-- Logo Area -->

    <!-- Header -->
    <div class="text-center mb-8">
      <h1
        class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-2"
      >
        Create New Password
      </h1>
      <p class="font-body-md text-body-md text-on-surface-variant">
        Create a strong new password to secure your Tasker account.
      </p>
    </div>
    <!-- Form -->
    <form class="space-y-6">
      <!-- New Password Field -->
      <div class="space-y-2">
        <label class="font-label-sm text-label-sm text-on-surface-variant block" for="new-password"
          >New Password</label
        >
        <div class="input-glass rounded-xl flex items-center px-4 py-3 relative">
          <span
            class="material-symbols-outlined text-outline mr-3"
            style="font-variation-settings: 'FILL' 0"
            >lock</span
          >
          <input
            class="bg-transparent border-none w-full text-on-surface focus:ring-0 p-0 placeholder-outline-variant font-body-md text-body-md"
            id="new-password"
            placeholder="••••••••"
            required=""
            type="password"
          />
          <button
            class="text-outline hover:text-primary transition-colors ml-2 focus:outline-none flex items-center"
            onclick="togglePassword('new-password', 'new-eye')"
            type="button"
          >
            <span
              class="material-symbols-outlined"
              id="new-eye"
              style="font-variation-settings: 'FILL' 0"
              >visibility</span
            >
          </button>
        </div>
      </div>
      <!-- Confirm Password Field -->
      <div class="space-y-2">
        <label
          class="font-label-sm text-label-sm text-on-surface-variant block"
          for="confirm-password"
          >Confirm Password</label
        >
        <div class="input-glass rounded-xl flex items-center px-4 py-3 relative">
          <span
            class="material-symbols-outlined text-outline mr-3"
            style="font-variation-settings: 'FILL' 0"
            >lock_reset</span
          >
          <input
            class="bg-transparent border-none w-full text-on-surface focus:ring-0 p-0 placeholder-outline-variant font-body-md text-body-md"
            id="confirm-password"
            placeholder="••••••••"
            required=""
            type="password"
          />
          <button
            class="text-outline hover:text-primary transition-colors ml-2 focus:outline-none flex items-center"
            onclick="togglePassword('confirm-password', 'confirm-eye')"
            type="button"
          >
            <span
              class="material-symbols-outlined"
              id="confirm-eye"
              style="font-variation-settings: 'FILL' 0"
              >visibility</span
            >
          </button>
        </div>
      </div>
      <!-- Action Button -->
      <button
        class="w-full bg-primary-gradient text-on-primary-container font-body-md text-body-md font-medium rounded-full py-4 px-6 flex items-center justify-center gap-2 hover:scale-[1.02] hover:shadow-[0_0_20px_rgba(94,106,210,0.4)] transition-all duration-300 mt-8"
        type="submit"
      >
        Reset Password
        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0"
          >arrow_forward</span
        >
      </button>
    </form>
    <!-- Navigation Link -->
    <div class="mt-8 text-center">
      <a
        class="inline-flex items-center gap-2 font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors duration-200"
        href="#"
      >
        <span
          class="material-symbols-outlined text-[20px]"
          style="font-variation-settings: 'FILL' 0"
          >arrow_back</span
        >
        Back to Login
      </a>
    </div>
  </div>
</main>
