<app-navbar></app-navbar>

<main class="flex-grow flex flex-col md:flex-row w-full max-w-[1600px] mx-auto">
  <!-- Left Side: Worker Visual -->
  <section
    class="w-full md:w-[55%] relative flex items-center justify-center p-gutter min-h-[400px] md:min-h-0 overflow-hidden"
  >
    <div
      class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-20 text-center w-full px-gutter pointer-events-none flex flex-col items-center justify-center"
    >
      <h2
        class="font-display-lg text-headline-lg-mobile md:text-display-lg text-white mb-4 drop-shadow-lg"
      >
        Build Your Reputation.<br />Grow Your Business.
      </h2>
      <p class="font-body-md text-body-xl text-white/80 max-w-xl mx-auto drop-shadow-md">
        Join the elite network of home service professionals and take your career to the next level
        with Fixo.
      </p>
    </div>
    <!-- Background Glows -->
    <div class="absolute inset-0 pointer-events-none">
      <div
        class="absolute top-1/4 left-1/4 w-96 h-96 bg-primary-container rounded-full mix-blend-screen filter blur-[100px] opacity-20"
      ></div>
      <div
        class="absolute bottom-1/4 right-1/4 w-80 h-80 bg-sky-blue rounded-full mix-blend-screen filter blur-[100px] opacity-20"
      ></div>
    </div>
    <div class="relative z-10 w-full max-w-2xl rounded-2xl overflow-hidden shadow-accent-glow">
      <img
        alt="Fixo Professionals"
        class="w-full h-auto object-cover rounded-2xl"
        data-alt="Professional home service workers including an electrician, plumber, and cleaner in uniform, set against a dark premium navy blue interior with dramatic, high-end lighting and a sophisticated atmosphere."
        src="https://lh3.googleusercontent.com/aida-public/AB6AXuAbsj58ZYm4qxO48FqGC-_6l6TABDhQwAvRjnTkAHcAugCU-Cq4rKPFV3R_zeIUxCqfEiLV1Cu0vRnufRo_weuKujeDk39wQaCw5CoN-t16wnU4bCwn31ujW9nG_kSUYHJSS78yHv3ac7yP5Jw48d-v8xYKXa3aTB0vSFjRAot-Sx8QdpmKxpOWzTO4mlEYPA_29Jv8z0np26wJBa6Vvx8KFNO55qGKmr60lquG97vnqYrAAq_RUpf3"
      />
    </div>
  </section>
  <!-- Right Side: Login Card -->
  <section class="w-full md:w-[45%] flex items-center justify-center p-margin-mobile md:p-gutter">
    <div
      class="w-full max-w-md bg-glass rounded-[2rem] p-8 md:p-10 flex flex-col gap-8 shadow-accent-glow relative z-10 shadow-[0_0_50px_rgba(46,74,209,0.3)]"
    >
      <div class="text-center">
        <h1
          class="font-display-lg text-headline-lg-mobile md:text-headline-lg text-on-primary-container mb-2"
        >
          Welcome Back
        </h1>
        <p class="font-body-md text-on-surface-variant text-body-md">
          Sign in to your Tasker Account
        </p>
      </div>
      <form class="flex flex-col gap-5">
        <div class="relative group">
          <span
            class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary transition-colors group-focus-within:text-sky-blue flex items-center justify-center"
            >mail</span
          >
          <input
            class="w-full bg-black/40 border border-glass-stroke rounded-xl pl-12 pr-4 py-3.5 text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all"
            placeholder="Email Address"
            required=""
            type="email"
          />
        </div>
        <div class="relative group">
          <span
            class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary transition-colors group-focus-within:text-sky-blue flex items-center justify-center"
            >lock</span
          >
          <input
            class="w-full bg-black/40 border border-glass-stroke rounded-xl pl-12 pr-4 py-3.5 text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all"
            placeholder="Password"
            required=""
            type="password"
          />
        </div>
        <div class="flex items-center justify-between mt-2">
          <label class="flex items-center gap-2 cursor-pointer group">
            <input
              class="rounded bg-black/20 border-glass-stroke text-primary focus:ring-primary focus:ring-offset-0 focus:ring-offset-transparent"
              type="checkbox"
            />
            <span
              class="font-body-md text-sm text-on-surface-variant group-hover:text-on-background transition-colors"
              >Remember Me</span
            >
          </label>
          <a
            class="font-body-md text-sm text-primary hover:text-sky-blue transition-colors"
            href="#"
            >Forgot Password?</a
          >
        </div>
        <button
          class="btn-primary w-full py-4 rounded-full font-body-md text-body-md font-medium text-white mt-4 flex justify-center items-center gap-2"
          type="submit"
        >
          Sign In
          <span class="material-symbols-outlined">arrow_forward</span>
        </button>
        <div class="relative flex items-center py-4">
          <div class="flex-grow border-t border-glass-stroke"></div>
          <span class="flex-shrink-0 mx-4 text-on-surface-variant text-sm font-body-md">or</span>
          <div class="flex-grow border-t border-glass-stroke"></div>
        </div>
        <button
          class="btn-ghost w-full py-3 rounded-full font-body-md text-body-md text-on-background flex justify-center items-center gap-3"
          type="button"
        >
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
            <path
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
              fill="#4285F4"
            ></path>
            <path
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              fill="#34A853"
            ></path>
            <path
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
              fill="#FBBC05"
            ></path>
            <path
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
              fill="#EA4335"
            ></path>
          </svg>
          Continue with Google
        </button>
      </form>
      <div class="text-center mt-2">
        <p class="font-body-md text-on-surface-variant text-sm">
          Don't have an account?
          <a class="text-primary hover:text-sky-blue transition-colors font-medium ml-1" href="#"
            >Become a Tasker</a
          >
        </p>
      </div>
    </div>
  </section>
</main>

<app-footer></app-footer>
