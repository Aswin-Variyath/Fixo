<section class="glass-panel p-6 mb-section-gap">
  <div class="flex flex-col md:flex-row gap-4 items-end">
    <div class="flex-grow w-full">
      <label class="filter-label" for="job-search">Search</label>
      <div class="relative"><span class="material-symbols-outlined filter-leading-icon">search</span><input id="job-search" class="filter-control pl-12" placeholder="Search jobs or services..." type="text" /></div>
    </div>
    <div class="w-full md:w-48">
      <label class="filter-label" for="job-location">Location</label>
      <div class="relative"><span class="material-symbols-outlined filter-leading-icon">location_on</span><select id="job-location" class="filter-control pl-12"><option>Kozhikode</option><option>Kochi</option><option>Trivandrum</option></select><span class="material-symbols-outlined filter-trailing-icon">expand_more</span></div>
    </div>
    <div class="w-full md:w-48">
      <label class="filter-label" for="job-category">Category</label>
      <div class="relative"><select id="job-category" class="filter-control"><option>All Services</option><option>Electrical</option><option>Plumbing</option></select><span class="material-symbols-outlined filter-trailing-icon">expand_more</span></div>
    </div>
    <div class="w-full md:w-48">
      <label class="filter-label" for="job-sort">Sort By</label>
      <div class="relative"><select id="job-sort" class="filter-control"><option>Nearest First</option><option>Highest Pay</option><option>Newest</option></select><span class="material-symbols-outlined filter-trailing-icon">expand_more</span></div>
    </div>
  </div>
</section>
