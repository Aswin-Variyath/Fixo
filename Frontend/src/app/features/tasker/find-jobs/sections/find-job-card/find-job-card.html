<article class="glass-panel job-card p-6 flex flex-col gap-4">
  <div class="flex justify-between items-start gap-4">
    <div>
      <h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-1">{{ job().service }}</h2>
      <div class="flex items-center gap-2 text-on-surface-variant"><span class="material-symbols-outlined text-[18px]">person</span><span class="font-body-md text-body-md">{{ job().customer }}</span></div>
    </div>
    <span class="availability-badge">Available</span>
  </div>

  <div class="grid grid-cols-2 gap-4 my-2">
    <div class="metadata-item"><span class="material-symbols-outlined">location_on</span><span>{{ job().location }}</span></div>
    <div class="metadata-item"><span class="material-symbols-outlined">calendar_today</span><span>{{ job().date }}</span></div>
    <div class="metadata-item"><span class="material-symbols-outlined">schedule</span><span>{{ job().time }} ({{ job().duration }})</span></div>
    <div class="metadata-item"><span class="material-symbols-outlined">directions_walk</span><span>{{ job().distance }}</span></div>
  </div>

  <p class="font-body-md text-body-md text-on-surface-variant border-l-2 border-primary/30 pl-4 py-1 italic">{{ job().description }}</p>

  <footer class="flex justify-between items-center gap-4 flex-wrap mt-auto pt-4 border-t border-glass-stroke">
    <div class="flex flex-col">
      <span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Est. Amount</span>
      <span class="font-headline-lg-mobile text-headline-lg-mobile text-sky-blue">{{ job().amount }}</span>
    </div>
    <div class="flex gap-3 flex-wrap">
      <button type="button" class="details-button">View Details</button>
      <button type="button" class="accept-button">Accept Job <span class="material-symbols-outlined text-[16px]">arrow_forward</span></button>
    </div>
  </footer>
</article>
