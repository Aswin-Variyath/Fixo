<app-navbar />

<div class="fixed inset-0 pointer-events-none z-0 overflow-hidden" aria-hidden="true">
  <div class="ambient-glow ambient-glow-left"></div>
  <div class="ambient-glow ambient-glow-right"></div>
</div>

<main class="flex-grow relative z-10 w-full max-w-container-max mx-auto px-margin-mobile md:px-gutter pt-32 pb-section-gap">
  <header class="mb-stack-md">
    <h1 class="find-jobs-title font-display-lg text-display-lg mb-4">Find Jobs</h1>
    <p class="font-body-xl text-body-xl text-on-surface-variant max-w-2xl">Discover available jobs that match your skills and location.</p>
  </header>

  <app-job-search-filters />

  <section class="grid grid-cols-1 md:grid-cols-2 gap-stack-md" aria-label="Available jobs">
    @for (job of jobs; track job.id) {
      <app-find-job-card [job]="job" />
    }
  </section>
</main>

<app-footer />
