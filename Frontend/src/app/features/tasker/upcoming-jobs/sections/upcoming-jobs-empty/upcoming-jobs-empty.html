<div
  class="glass-panel rounded-[20px] p-12 md:p-24 flex flex-col items-center justify-center text-center max-w-2xl w-full relative overflow-hidden group"
>
  <!-- Subtle atmospheric glow behind icon -->
  <div
    class="absolute inset-0 bg-gradient-to-b from-royal-blue/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-700 pointer-events-none"
  ></div>

  <div class="glow-shadow mb-8">
    <div
      class="w-24 h-24 rounded-full bg-surface-container flex items-center justify-center border border-glass-stroke shadow-inner"
    >
      <span
        class="material-symbols-outlined text-[48px] text-on-surface-variant opacity-50"
        style="font-variation-settings: 'FILL' 1"
      >
        calendar_month
      </span>
    </div>
  </div>

  <h1
    class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-stack-md font-bold"
  >
    No Upcoming Jobs
  </h1>

  <p class="font-body-xl text-body-xl text-on-surface-variant max-w-md mx-auto mb-10 leading-relaxed">
    You have no scheduled jobs at the moment. Accepted requests will appear here.
  </p>

  <div class="flex flex-col sm:flex-row gap-4">
    <a
      routerLink="/tasker/pending-requests"
      class="bg-gradient-to-r from-royal-blue to-sky-blue text-white px-8 py-4 rounded-full font-label-sm text-label-sm uppercase tracking-wider hover:scale-[1.02] transition-transform duration-300 glow-shadow relative overflow-hidden group/btn cursor-pointer inline-flex items-center justify-center gap-2"
    >
      <span class="material-symbols-outlined text-[18px]">pending_actions</span>
      View Pending Requests
    </a>
    <button
      type="button"
      (click)="onRefresh()"
      class="btn-secondary px-8 py-4 rounded-full font-label-sm text-label-sm uppercase tracking-wider hover:scale-[1.02] transition-all cursor-pointer inline-flex items-center justify-center gap-2 text-on-surface"
    >
      <span class="material-symbols-outlined text-[18px]">refresh</span>
      Refresh Jobs
    </button>
  </div>
</div>
