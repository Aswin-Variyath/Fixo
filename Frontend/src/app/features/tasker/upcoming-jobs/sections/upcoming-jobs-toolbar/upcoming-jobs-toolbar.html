<div
  class="glass-panel rounded-xl p-4 mb-8 flex flex-col md:flex-row gap-4 justify-between items-center z-20 relative"
>
  <!-- Filters -->
  <div class="flex flex-wrap gap-2 w-full md:w-auto">
    @for (filter of filters; track filter) {
      <button
        type="button"
        (click)="selectFilter(filter)"
        class="px-4 py-2 rounded-full font-label-sm text-label-sm transition-colors cursor-pointer"
        [class.bg-primary-container/20]="activeFilter() === filter"
        [class.border]="true"
        [class.border-primary]="activeFilter() === filter"
        [class.text-primary]="activeFilter() === filter"
        [class.hover:bg-primary-container/30]="activeFilter() === filter"
        [class.border-glass-stroke]="activeFilter() !== filter"
        [class.text-on-surface-variant]="activeFilter() !== filter"
        [class.hover:bg-surface-variant]="activeFilter() !== filter"
      >
        {{ filter }}
      </button>
    }
  </div>

  <!-- Search Input -->
  <div class="relative w-full md:w-64 group">
    <span
      class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors text-[20px]"
      >search</span
    >
    <input
      class="w-full bg-surface-container-lowest border border-glass-stroke rounded-lg py-2 pl-10 pr-4 text-on-background font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary focus:bg-surface-dim transition-all outline-none placeholder:text-on-surface-variant/50"
      placeholder="Search jobs"
      type="text"
    />
  </div>
</div>
