<div class="min-h-screen flex flex-col login-gradient-bg">
  <app-navbar></app-navbar>

  <!-- Atmospheric Background -->
  <div class="fixed inset-0 pointer-events-none z-0">
    <div
      class="absolute top-[-10%] right-[-5%] w-[600px] h-[600px] bg-royal-blue/20 rounded-full blur-[120px]"
    ></div>

    <div
      class="absolute bottom-[-10%] left-[-5%] w-[500px] h-[500px] bg-sky-blue/10 rounded-full blur-[100px]"
    ></div>
  </div>

  <main
    class="flex-1 flex items-center justify-center pt-32 pb-section-gap px-margin-mobile relative z-10"
  >
    <div class="w-full max-w-[480px] animate-fade-in">
      <div class="glass-card glow-shadow-primary p-8 md:p-12">
        <div class="text-center mb-10">
          <h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">Welcome Back</h1>
          <p class="font-body-md text-body-md text-on-surface-variant">
            Manage your home services with precision.
          </p>
        </div>
        <!-- Login Form -->
        <form class="space-y-6" onsubmit="event.preventDefault()">
          <div class="space-y-2">
            <label class="font-label-sm text-label-sm text-on-surface-variant ml-1"
              >EMAIL ADDRESS</label
            >
            <div class="relative">
              <span
                class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50"
                >mail</span
              >
              <input
                class="w-full bg-surface-container-lowest border border-glass-stroke rounded-xl py-3.5 pl-12 pr-4 text-on-surface placeholder:text-outline/50 focus:outline-none input-focus-glow transition-all duration-300"
                placeholder="name@company.com"
                type="email"
              />
            </div>
          </div>
          <div class="space-y-2">
            <div class="flex justify-between items-center ml-1">
              <label class="font-label-sm text-label-sm text-on-surface-variant">PASSWORD</label>
              <a
                class="font-label-sm text-label-sm text-primary hover:underline transition-all"
                href="#"
                >Forgot?</a
              >
            </div>
            <div class="relative">
              <span
                class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50"
                >lock</span
              >
              <input
                class="w-full bg-surface-container-lowest border border-glass-stroke rounded-xl py-3.5 pl-12 pr-4 text-on-surface placeholder:text-outline/50 focus:outline-none input-focus-glow transition-all duration-300"
                placeholder="••••••••"
                type="password"
              />
            </div>
          </div>
          <button
            class="w-full py-4 px-6 bg-primary-container text-on-primary-container font-headline-lg text-body-md font-bold rounded-full hover:scale-[1.02] active:scale-[0.98] transition-all duration-300 shadow-glow-sm hover:shadow-primary-container/40 flex items-center justify-center gap-2"
          >
            Login to Fixo
            <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
          </button>
        </form>
        <!-- Divider -->
        <div class="relative my-8">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-glass-stroke"></div>
          </div>
          <div class="relative flex justify-center text-label-sm uppercase">
            <span class="bg-[#0B111B] px-4 text-on-surface-variant/60 font-label-sm"
              >or continue with</span
            >
          </div>
        </div>
        <!-- Social Auth -->
        <button
          class="w-full py-3.5 px-6 glass-card bg-white/5 hover:bg-white/10 border-glass-stroke text-on-surface font-body-md font-medium transition-all duration-300 flex items-center justify-center gap-3"
        >
          <svg class="w-5 h-5" viewBox="0 0 24 24">
            <path
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
              fill="#4285F4"
            ></path>
            <path
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              fill="#34A853"
            ></path>
            <path
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"
              fill="#FBBC05"
            ></path>
            <path
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
              fill="#EA4335"
            ></path>
          </svg>
          Continue with Google
        </button>
        <p class="mt-8 text-center font-body-md text-on-surface-variant">
          Don't have an account?
          <a class="text-primary font-bold hover:text-sky-blue transition-colors" href="#"
            >Create one.</a
          >
        </p>
      </div>
    </div>
  </main>

  <app-footer></app-footer>
</div>
