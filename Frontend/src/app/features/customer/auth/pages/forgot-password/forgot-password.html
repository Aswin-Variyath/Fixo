<div class="fixed inset-0 z-[-1] pointer-events-none overflow-hidden">
  <div
    class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] rounded-full bg-royal-blue/10 blur-[120px]"
  ></div>
  <div
    class="absolute bottom-[-20%] right-[-10%] w-[60%] h-[60%] rounded-full bg-sky-blue/10 blur-[150px]"
  ></div>
</div>
<!-- Main Content Canvas - Hide shell for transactional flows -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-gutter z-10">
  <div
    class="glass-card w-full max-w-[440px] rounded-[20px] p-8 md:p-10 flex flex-col gap-8 glow-shadow-primary relative overflow-hidden"
  >
    <!-- Inner subtle glow top right -->
    <div
      class="absolute top-0 right-0 w-32 h-32 bg-primary/5 rounded-full blur-2xl pointer-events-none"
    ></div>
    <!-- Header Section -->
    <div class="flex flex-col gap-stack-sm text-center">
      <!-- Brand logo just for context if nav is hidden -->
      <div class="mb-4">
        <span class="font-headline-lg text-headline-lg font-bold text-primary">Fixo</span>
      </div>
      <h1
        class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface"
      >
        Forgot Password
      </h1>
      <p class="font-body-md text-body-md text-on-surface-variant">
        Enter your registered email address. We'll send you a password reset link.
      </p>
    </div>
    <!-- Form Section -->
    <form
      class="flex flex-col gap-6 w-full"
      
    >
      <!-- Email Input Group -->
      <div class="flex flex-col gap-stack-sm">
        <label class="font-label-sm text-label-sm text-on-surface-variant uppercase" for="email"
          >Email Address</label
        >
        <div
          class="input-glass rounded-xl flex items-center px-4 py-3 group relative overflow-hidden"
        >
          <!-- subtle inner border highlight -->
          <div class="absolute inset-0 border border-white/5 rounded-xl pointer-events-none"></div>
          <span
            class="material-symbols-outlined text-on-surface-variant mr-3 group-focus-within:text-primary transition-colors"
            data-icon="mail"
            data-weight="fill"
            style="font-variation-settings: 'FILL' 1"
            >mail</span
          >
          <input
            class="bg-transparent border-none w-full text-on-surface font-body-md text-body-md placeholder:text-on-surface-variant/50 focus:ring-0 p-0"
            id="email"
            name="email"
            placeholder="Enter your email address"
            required=""
            type="email"
          />
        </div>
      </div>
      <!-- Actions -->
      <div class="flex flex-col gap-4 mt-2">
        <button
          class="btn-primary w-full py-4 rounded-full text-white font-body-md text-body-md font-semibold relative overflow-hidden"
          type="submit"
        >
          <span class="relative z-10 flex items-center justify-center gap-2">
            Send Reset Link
            <span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward"
              >arrow_forward</span
            >
          </span>
          <!-- Gloss highlight -->
          <div
            class="absolute top-0 left-0 right-0 h-1/2 bg-gradient-to-b from-white/20 to-transparent pointer-events-none"
          ></div>
        </button>
        <a
          class="text-center font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors duration-200 mt-2 flex items-center justify-center gap-2"
          href="#"
        >
          <span class="material-symbols-outlined text-[18px]" data-icon="arrow_back"
            >arrow_back</span
          >
          Back to Login
        </a>
      </div>
    </form>
    <!-- Success Message State (Hidden by default) -->
    <div class="hidden flex-col items-center gap-6 text-center py-4" id="successMessage">
      <div
        class="w-16 h-16 rounded-full bg-primary-container/20 flex items-center justify-center mb-2 border border-primary/30"
      >
        <span
          class="material-symbols-outlined text-primary text-[32px]"
          data-icon="mark_email_read"
          data-weight="fill"
          style="font-variation-settings: 'FILL' 1"
          >mark_email_read</span
        >
      </div>
      <h3 class="font-body-xl text-body-xl text-on-surface">Check your inbox</h3>
      <p class="font-body-md text-body-md text-on-surface-variant">
        We've sent a password reset link to your email. It will expire in 1 hour.
      </p>
      <button class="mt-4 font-body-md text-body-md text-primary hover:text-sky-blue transition-colors">
        Didn't receive the email? Try again.
      </button>
    </div>
  </div>
</main>
