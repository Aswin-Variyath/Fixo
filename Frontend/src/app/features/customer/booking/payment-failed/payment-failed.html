<!-- Payment Failed page shell
     ─────────────────────────────────────────────────────────────────
     Structure:
       - Ambient background blobs (fixed, non-interactive)
       - Shared Navbar
       - Shared BookingProgress (step 3 = failed)
       - Section: PaymentFailedHeader
       - Section: PaymentFailedBookingDetails
       - Section: PaymentFailedSummary
       - Section: PaymentFailedActions  (emits retryPayment → openPolicyModal)
       - Shared PolicyModal (signal-driven open/close)
       - Shared Footer
     ─────────────────────────────────────────────────────────────────  -->

<!-- Ambient background lighting blobs -->
<div class="fixed inset-0 z-0 pointer-events-none overflow-hidden">
  <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-primary-container rounded-full mix-blend-screen filter blur-[100px] opacity-20"></div>
  <div class="absolute bottom-1/4 right-1/4 w-80 h-80 bg-sky-blue rounded-full mix-blend-screen filter blur-[100px] opacity-10"></div>
</div>

<!-- Shared Navbar -->
<app-navbar></app-navbar>

<!-- Main content area -->
<main class="flex-grow flex flex-col items-center justify-start relative z-10 px-margin-mobile pt-32 pb-section-gap md:pb-[120px]">

  <!-- Booking Progress: step 3 = Payment, shown as FAILED -->
  <div class="mb-12 w-full max-w-4xl mx-auto">
    <app-booking-progress [currentStep]="3" [failedStep]="3"></app-booking-progress>
  </div>

  <!-- Content sections stacked within a centred max-w-2xl column -->
  <div class="w-full max-w-2xl mx-auto flex flex-col gap-stack-md">

    <!-- Error icon, heading, subtitle, status badge -->
    <app-payment-failed-header></app-payment-failed-header>

    <!-- Booking details glass card -->
    <app-payment-failed-booking-details></app-payment-failed-booking-details>

    <!-- Payment attempt summary + disclaimer -->
    <app-payment-failed-summary></app-payment-failed-summary>

    <!-- Action buttons (Retry / Back to Booking / Back to Home) -->
    <app-payment-failed-actions
      (retryPayment)="openPolicyModal()"
    ></app-payment-failed-actions>

  </div>

</main>

<!-- Policy Modal (reused from Payment feature) -->
<app-policy-modal
  [isOpen]="isPolicyModalOpen()"
  (closeModal)="closePolicyModal()"
  (confirmed)="onPolicyConfirmed()"
></app-policy-modal>

<!-- Shared Footer -->
<app-footer></app-footer>
