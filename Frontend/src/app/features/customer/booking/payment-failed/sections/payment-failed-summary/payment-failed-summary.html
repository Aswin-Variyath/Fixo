<!-- Payment Failed Summary: payment attempt card + provider disclaimer -->
<div class="w-full max-w-2xl mx-auto flex flex-col gap-stack-md">

  <!-- Payment Attempt card -->
  <div class="glass-card p-6 text-left flex flex-col gap-4">
    <h3 class="font-body-md text-body-md font-semibold text-on-primary-container">Payment Attempt</h3>
    <div class="flex flex-col gap-2">
      <div class="flex justify-between">
        <span class="text-on-surface-variant">Status</span>
        <span class="text-error font-semibold">Failed</span>
      </div>
      <div class="flex justify-between">
        <span class="text-on-surface-variant">Method</span>
        <span class="text-on-surface">UPI</span>
      </div>
      <div class="flex justify-between">
        <span class="text-on-surface-variant">Option</span>
        <span class="text-on-surface">50% Advance</span>
      </div>
      <div class="flex justify-between border-t border-glass-stroke pt-2 mt-2">
        <span class="text-on-surface-variant">Amount Attempted</span>
        <span class="text-primary font-semibold">₹600</span>
      </div>
    </div>
  </div>

  <!-- Provider debit disclaimer -->
  <div class="px-2 flex flex-col gap-2">
    <p class="text-[12px] text-on-surface-variant leading-relaxed">
      Your booking has not been completed. If any amount was debited from your account,
      it will be handled according to the payment provider's process.
    </p>
  </div>

</div>
