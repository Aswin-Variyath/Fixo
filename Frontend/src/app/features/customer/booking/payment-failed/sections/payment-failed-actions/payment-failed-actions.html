<!-- Payment Failed Actions: Retry Payment | Back to Booking | Back to Home -->
<div class="w-full max-w-2xl mx-auto flex flex-col gap-4 mt-stack-md">

  <!-- Primary actions row: Retry + Back to Booking -->
  <div class="flex flex-col sm:flex-row gap-4 w-full">

    <!-- Retry Payment → emits to parent which opens PolicyModal -->
    <button
      type="button"
      id="retry-payment-btn"
      class="flex-1 btn-primary rounded-full py-4 font-body-md text-body-md font-semibold text-on-primary-container flex justify-center items-center gap-2 cursor-pointer"
      (click)="retryPayment.emit()"
    >
      Retry Payment
    </button>

    <!-- Back to Booking (static for now — no route yet) -->
    <button
      type="button"
      id="back-to-booking-btn"
      class="flex-1 btn-secondary rounded-full py-4 font-body-md text-body-md font-semibold text-on-primary-container flex justify-center items-center gap-2 cursor-pointer"
    >
      Back to Booking
    </button>

  </div>

  <!-- Back to Home (tertiary text link) -->
  <button
    type="button"
    id="back-to-home-btn"
    class="w-full py-2 font-body-md text-body-md text-on-surface-variant hover:text-on-surface transition-colors cursor-pointer"
  >
    Back to Home
  </button>

</div>
