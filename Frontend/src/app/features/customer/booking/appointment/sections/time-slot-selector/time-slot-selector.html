<!-- Select Time -->
<div class="glass-card rounded-xl p-6">
  <h3 class="font-body-xl text-body-xl mb-4 text-on-background">Select Time<span class="ml-4 text-sm font-label-sm text-primary animate-pulse hidden" id="availability-loader">Checking availability...</span></h3>
  <div class="flex flex-wrap gap-3">
    <button class="px-4 py-2 rounded-full border border-primary bg-primary/10 text-primary font-label-sm text-label-sm shadow-[0_0_10px_rgba(189,194,255,0.2)]">10:00 AM</button>
    <button class="px-4 py-2 rounded-full border border-glass-stroke text-on-surface-variant hover:bg-white/5 font-label-sm text-label-sm transition-colors">11:30 AM</button>
    <button class="px-4 py-2 rounded-full border border-glass-stroke text-on-surface-variant hover:bg-white/5 font-label-sm text-label-sm transition-colors">2:00 PM</button>
    <button class="px-4 py-2 rounded-full border border-glass-stroke text-on-surface-variant hover:bg-white/5 font-label-sm text-label-sm transition-colors">4:30 PM</button>
  </div>
</div>
