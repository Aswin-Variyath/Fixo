<!-- Customer Details Section -->
<section class="glass-card rounded-xl p-6">
  <h2 class="font-body-xl text-body-xl text-on-background mb-6 flex items-center gap-2">
    <span class="material-symbols-outlined text-primary">person</span>
    Customer Details
  </h2>
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div>
      <label class="block font-label-sm text-on-surface-variant mb-2">FIRST NAME</label>
      <input
        class="w-full bg-surface-container-lowest border border-glass-stroke rounded-lg p-3 text-on-surface font-body-md focus:border-primary focus:ring-1 focus:ring-primary focus:bg-surface-container-low transition-colors opacity-60"
        readonly="true"
        type="text"
        value="Anjali"
      />
    </div>
    <div>
      <label class="block font-label-sm text-on-surface-variant mb-2">LAST NAME</label>
      <input
        class="w-full bg-surface-container-lowest border border-glass-stroke rounded-lg p-3 text-on-surface font-body-md focus:border-primary focus:ring-1 focus:ring-primary focus:bg-surface-container-low transition-colors opacity-60"
        readonly="true"
        type="text"
        value="Menon"
      />
    </div>
    <div>
      <label class="block font-label-sm text-on-surface-variant mb-2">PHONE NUMBER</label>
      <input
        class="w-full bg-surface-container-lowest border border-glass-stroke rounded-lg p-3 text-on-surface font-body-md focus:border-primary focus:ring-1 focus:ring-primary focus:bg-surface-container-low transition-colors opacity-60"
        readonly="true"
        type="tel"
        value="+91 98765 43210"
      />
    </div>
    <div>
      <label class="block font-label-sm text-on-surface-variant mb-2"
        >EMAIL ADDRESS</label
      >
      <input
        class="w-full bg-surface-container-lowest border border-glass-stroke rounded-lg p-3 text-on-surface font-body-md focus:border-primary focus:ring-1 focus:ring-primary focus:bg-surface-container-low transition-colors opacity-60"
        readonly="true"
        type="email"
        value="anjali.menon@example.com"
      />
    </div>
  </div>
</section>
