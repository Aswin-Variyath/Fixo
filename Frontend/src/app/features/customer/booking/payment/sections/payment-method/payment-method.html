<div class="glass-panel glass-inner-border p-6 flex flex-col gap-4 relative overflow-hidden">
  <!-- Option 1: Card (Selected) -->
  <label class="group relative flex items-center p-4 rounded-xl border border-primary-container bg-primary-container/10 cursor-pointer transition-all hover:bg-primary-container/20">
    <div class="flex items-center justify-center w-12 h-12 rounded-lg bg-surface-container mr-4 text-primary">
      <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">credit_card</span>
    </div>
    <div class="flex-grow">
      <h3 class="font-body-md text-body-md font-semibold text-on-surface">Credit / Debit Card</h3>
      <p class="font-label-sm text-label-sm text-on-surface-variant mt-1">Visa, Mastercard, Amex, RuPay</p>
    </div>
    <div class="w-5 h-5 rounded-full border-2 border-primary-container flex items-center justify-center">
      <div class="w-2.5 h-2.5 rounded-full bg-primary-container"></div>
    </div>
    <!-- Inner Glow for selected state -->
    <div class="absolute inset-0 rounded-xl shadow-[inset_0_0_20px_rgba(94,106,210,0.15)] pointer-events-none"></div>
    <input checked="" class="hidden" name="payment_method" type="radio" value="card"/>
  </label>
  <!-- Card Details Form (Visible only when Card is selected) -->
  <div class="pl-16 pr-4 pb-4 flex flex-col gap-4">
    <div class="relative">
      <input class="w-full bg-surface-container-lowest border border-glass-stroke rounded-lg px-4 py-3 text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-outline" placeholder="Card Number" type="text"/>
      <span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline">payment</span>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <input class="w-full bg-surface-container-lowest border border-glass-stroke rounded-lg px-4 py-3 text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-outline" placeholder="MM/YY" type="text"/>
      <input class="w-full bg-surface-container-lowest border border-glass-stroke rounded-lg px-4 py-3 text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-outline" placeholder="CVV" type="text"/>
    </div>
    <input class="w-full bg-surface-container-lowest border border-glass-stroke rounded-lg px-4 py-3 text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-outline" placeholder="Cardholder Name" type="text"/>
  </div>
  <!-- Option 2: UPI -->
  <label class="flex items-center p-4 rounded-xl border border-glass-stroke bg-surface-container-low/30 cursor-pointer transition-all hover:bg-white/5 hover:border-outline-variant">
    <div class="flex items-center justify-center w-12 h-12 rounded-lg bg-surface-container mr-4 text-on-surface-variant">
      <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">qr_code_scanner</span>
    </div>
    <div class="flex-grow">
      <h3 class="font-body-md text-body-md font-medium text-on-surface">UPI</h3>
      <p class="font-label-sm text-label-sm text-on-surface-variant mt-1">GPay, PhonePe, Paytm</p>
    </div>
    <div class="w-5 h-5 rounded-full border-2 border-outline flex items-center justify-center"></div>
    <input class="hidden" name="payment_method" type="radio" value="upi"/>
  </label>
  <!-- Option 3: Net Banking -->
  <label class="flex items-center p-4 rounded-xl border border-glass-stroke bg-surface-container-low/30 cursor-pointer transition-all hover:bg-white/5 hover:border-outline-variant">
    <div class="flex items-center justify-center w-12 h-12 rounded-lg bg-surface-container mr-4 text-on-surface-variant">
      <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">account_balance</span>
    </div>
    <div class="flex-grow">
      <h3 class="font-body-md text-body-md font-medium text-on-surface">Net Banking</h3>
      <p class="font-label-sm text-label-sm text-on-surface-variant mt-1">All major Indian banks</p>
    </div>
    <div class="w-5 h-5 rounded-full border-2 border-outline flex items-center justify-center"></div>
    <input class="hidden" name="payment_method" type="radio" value="netbanking"/>
  </label>
  <!-- Option 4: PayPal -->
  <label class="flex items-center p-4 rounded-xl border border-glass-stroke bg-surface-container-low/30 cursor-pointer transition-all hover:bg-white/5 hover:border-outline-variant">
    <div class="flex items-center justify-center w-12 h-12 rounded-lg bg-surface-container mr-4 text-on-surface-variant">
      <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">local_atm</span>
    </div>
    <div class="flex-grow">
      <h3 class="font-body-md text-body-md font-medium text-on-surface">PayPal</h3>
      <p class="font-label-sm text-label-sm text-on-surface-variant mt-1">International payments</p>
    </div>
    <div class="w-5 h-5 rounded-full border-2 border-outline flex items-center justify-center"></div>
    <input class="hidden" name="payment_method" type="radio" value="paypal"/>
  </label>
</div>
