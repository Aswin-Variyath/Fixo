<!-- Desktop sticky booking card -->
<div class="hidden lg:block lg:col-span-4 relative">
  <div class="sticky top-[120px] glass-card p-8 flex flex-col gap-6 glow-shadow">
    <div class="flex justify-between items-center pb-6 border-b border-glass-stroke">
      <div class="flex flex-col gap-1">
        <h3 class="font-bold text-on-surface">Ramesh Kumar</h3>
        <div class="flex items-center gap-1 text-tertiary-fixed-dim text-sm">
          <span
            class="material-symbols-outlined text-sm"
            style="font-variation-settings: 'FILL' 1"
            >star</span
          ><span class="font-bold">4.9</span>
        </div>
      </div>
      <div class="text-right">
        <span class="text-on-surface-variant text-xs">Hourly Rate</span>
        <div class="text-2xl text-primary font-bold">
          ₹600<span class="text-sm font-normal text-on-surface-variant">/hr</span>
        </div>
      </div>
    </div>
    <div class="flex flex-col gap-4">
      <div class="flex items-center gap-3 text-on-surface">
        <span class="material-symbols-outlined text-primary">check_circle</span>
        <span>Available Today</span>
      </div>
      <div class="flex items-center gap-3 text-on-surface">
        <span class="material-symbols-outlined text-primary">bolt</span>
        <span>Usually responds in 15 min</span>
      </div>
    </div>
    <div class="flex flex-col gap-3 mt-4">
      <button
        class="btn-primary w-full py-4 rounded-full font-bold flex items-center justify-center gap-2 text-lg"
      >
        Book Now
      </button>
      <button
        class="btn-secondary w-full py-3 rounded-full flex items-center justify-center gap-2"
      >
        <span class="material-symbols-outlined">chat</span> Message Ramesh
      </button>
    </div>
    <div
      class="mt-4 p-4 rounded-xl bg-surface-container border border-glass-stroke flex flex-col gap-4"
    >
      <h4 class="font-label-sm text-label-sm text-on-surface-variant uppercase">
        Location
      </h4>
      <div class="flex flex-col gap-3">
        <div class="flex items-start gap-3">
          <span class="material-symbols-outlined text-primary">location_on</span>
          <div>
            <p class="text-on-surface font-medium">Kozhikode, Kerala</p>
            <p class="text-xs text-primary font-bold mt-1">2.4 km from your location</p>
          </div>
        </div>
        <div
          class="text-xs text-on-surface-variant leading-relaxed border-t border-glass-stroke pt-3"
        >
          <span class="font-medium text-on-surface">Serves:</span> Kozhikode, Koyilandy,
          Ramanattukara, and nearby areas.
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Mobile bottom action bar -->
<div
  class="lg:hidden fixed bottom-0 left-0 w-full bg-deep-navy/90 backdrop-blur-xl border-t border-glass-stroke p-4 flex items-center gap-3 z-50"
>
  <button class="p-3 rounded-xl border border-glass-stroke text-on-surface-variant">
    <span class="material-symbols-outlined">favorite</span></button
  ><button
    class="flex-1 py-3 rounded-xl border border-glass-stroke text-on-surface font-medium"
  >
    Message</button
  ><button class="flex-[2] btn-primary py-3 rounded-xl font-bold">Book Now</button>
</div>
