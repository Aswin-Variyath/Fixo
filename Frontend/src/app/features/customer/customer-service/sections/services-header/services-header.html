<!-- ============================================================
     BREADCRUMB
============================================================ -->
<nav
  aria-label="Breadcrumb"
  class="flex items-center gap-1.5 text-xs md:text-sm text-outline mb-6"
>
  <a
    [routerLink]="['/customer/home']"
    class="hover:text-on-surface transition-colors"
  >
    Home
  </a>

  <span class="material-symbols-outlined text-[14px]">
    chevron_right
  </span>

  <span class="text-outline">
    Services
  </span>

  <span class="material-symbols-outlined text-[14px]">
    chevron_right
  </span>

  <span class="text-primary font-medium">
    {{ category()?.name }}
  </span>
</nav>


<!-- ============================================================
     CATEGORY HERO
============================================================ -->
<section
  class="glass-panel p-6 md:p-10 relative overflow-hidden shadow-[0_8px_32px_0_rgba(0,0,0,0.37)] border border-glass-stroke"
>

  <!-- Internal ambient corner glows -->
  <div
    class="absolute -top-20 -right-20 w-80 h-80 rounded-full bg-royal-blue/20 blur-3xl pointer-events-none"
  ></div>

  <div
    class="absolute -bottom-16 -left-16 w-60 h-60 rounded-full bg-sky-blue/15 blur-2xl pointer-events-none"
  ></div>


  <!-- Hero content -->
  <div class="relative z-10 max-w-3xl">

    <!-- Category eyebrow pill -->
    <div
      class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-royal-blue/20 border border-royal-blue/30 text-sky-blue text-xs font-mono font-medium tracking-wide uppercase mb-3"
    >
      <span class="material-symbols-outlined text-[14px]">
        {{ category()?.icon }}
      </span>

      <span>
        Category: {{ category()?.name }}
      </span>
    </div>


    <!-- Category title -->
    <h1
      class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface tracking-tight leading-tight mb-3"
    >
      {{ category()?.name }} Services
    </h1>


    <!-- Category description -->
    <p
      class="text-on-surface-variant text-base md:text-lg leading-relaxed max-w-2xl"
    >
      {{ category()?.description }}
    </p>


    <!-- ========================================================
         CATEGORY QUICK-SWITCH PILLS
    ========================================================= -->
    <div
      class="mt-6 pt-5 border-t border-glass-stroke/60 flex items-center gap-2 overflow-x-auto pb-1 text-xs category-pills-row"
    >

      <span
        class="text-outline text-xs font-mono uppercase mr-1 hidden sm:inline flex-shrink-0"
      >
        Other:
      </span>


      @for (item of categories(); track item.id) {

        <a
          class="category-pill"
          [class.category-pill--active]="item.id === category()?.id"
          [routerLink]="['/customer/customer-service']"
          [queryParams]="{ category: item.slug }"
          [attr.aria-current]="
            item.id === category()?.id ? 'page' : null
          "
        >
          {{ item.name }}
        </a>

      }

    </div>

  </div>

</section>
