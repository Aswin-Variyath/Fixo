<!-- Navbar -->
<app-navbar></app-navbar>


<!-- Ambient background glows -->
<div
  class="ambient-blob w-[560px] h-[560px] bg-royal-blue top-[-100px] left-[-200px]"
></div>

<div
  class="ambient-blob w-[500px] h-[500px] bg-sky-blue bottom-[-100px] right-[-100px]"
></div>


<!-- Main Services Page -->
<main
  class="w-full max-w-container-max mx-auto px-margin-mobile md:px-gutter pt-28 md:pt-32 pb-section-gap flex flex-col gap-8"
>

  <!-- Services Header -->
  <app-services-header
    [category]="selectedCategory()"
    [categories]="categories()"
  ></app-services-header>


  <!-- Search -->
  <app-search
    [placeholder]="
      selectedCategory()
        ? 'Search ' + selectedCategory()!.name.toLowerCase() + ' services...'
        : 'Search services...'
    "
    (searchChange)="onSearch($event)"
  ></app-search>


  <!-- Service Results -->
  <app-service-results
    (loadMore)="loadMore()"
  ></app-service-results>

</main>


<!-- Footer -->
<app-footer></app-footer>
