@if (showLocationModal()) {
  <app-location-modal
    (locationSelected)="onLocationSelected($event)"
    (closed)="closeLocationModal()"
  />
}

<app-navbar></app-navbar>

<main
  class="w-full max-w-container-max mx-auto px-margin-mobile md:px-gutter pt-24 pb-section-gap"
>
  <app-discovery-header></app-discovery-header>

  <section class="mt-10 flex flex-col lg:flex-row items-start gap-10">
    <div class="w-full lg:w-80 lg:flex-shrink-0">
      <app-filters (filtersChange)="onFiltersChange($event)"></app-filters>
    </div>

    <div class="w-full lg:flex-1 min-w-0">
      <app-tasker-results
  [appliedFilters]="appliedFilters()"
  (removeDistance)="removeDistanceFilter()"
  (removeAvailability)="removeAvailabilityFilter()"
  (removeRating)="removeRatingFilter()"
  [emptyState]="emptyState()"
  (removePrice)="onPriceRemove()"
  (sortChange)="onSortChange($event)"
></app-tasker-results>
    </div>
  </section>
</main>

<app-footer></app-footer>
