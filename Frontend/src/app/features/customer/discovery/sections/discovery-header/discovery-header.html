<section class="flex flex-col gap-stack-md pt-stack-md">

  <div class="flex flex-col gap-2">

    <h1
      class="font-headline-lg-mobile md:font-headline-lg
             text-headline-lg-mobile md:text-headline-lg
             text-on-surface"
    >
      Find the Right Tasker for Your Job
    </h1>

    <p class="font-body-xl text-body-xl text-on-surface-variant">
      Discover trusted, verified professionals near you.
    </p>

  </div>

  <div class="glass-panel p-stack-md md:p-gutter mt-stack-md">

    <form class="flex flex-col md:flex-row gap-stack-md w-full">

      <!-- Service -->
      <div class="flex-1 relative">

        <div class="glass-input rounded-xl flex items-center px-4 py-3 h-full">

          <span class="material-symbols-outlined text-on-surface-variant mr-3">
            search
          </span>

          <input
            class="w-full bg-transparent border-none text-on-surface
                   placeholder-on-surface-variant focus:ring-0 p-0 text-base"
            placeholder="Search taskers or services..."
            type="text"
          />

        </div>

      </div>

      <!-- Location -->
      <div class="flex-1 relative">

        <div class="glass-input rounded-xl flex items-center px-4 py-3 h-full">

          <span class="material-symbols-outlined text-primary mr-3">
            location_on
          </span>

          <input
            class="w-full bg-transparent border-none text-on-surface
                   placeholder-on-surface-variant focus:ring-0 p-0 text-base"
            placeholder="Location"
            type="text"
            value="Kozhikode"
          />

          <button
            class="text-primary hover:text-sky-blue ml-2"
            title="Current Location"
            type="button"
          >
            <span class="material-symbols-outlined text-sm">
              my_location
            </span>
          </button>

        </div>

      </div>

      <!-- Search -->
      <button
        class="btn-primary rounded-xl px-8 py-3 text-white font-medium
               flex items-center justify-center whitespace-nowrap"
        type="submit"
      >
        Search Taskers
      </button>

    </form>

  </div>

</section>
