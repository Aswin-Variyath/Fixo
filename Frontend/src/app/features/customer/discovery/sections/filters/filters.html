<aside class="w-full lg:w-80 flex-shrink-0">
  <div
    class="glass-panel p-stack-md sticky top-[100px] flex flex-col gap-stack-md max-h-[calc(100vh-120px)] overflow-y-auto"
  >
    <!-- Header -->
    <div class="flex justify-between items-center mb-2">
      <h2 class="text-lg font-semibold">Filters</h2>

      <button
        type="button"
        class="text-sm text-primary hover:text-sky-blue transition-colors"
        (click)="clearAll()"
      >
        Clear All
      </button>
    </div>

    <!-- Location Radius -->
    <div class="flex flex-col gap-3">
      <h3
        class="text-sm font-medium text-on-surface-variant uppercase tracking-wider"
      >
        Location Radius
      </h3>

      <div class="flex flex-wrap gap-2">
        <button
          type="button"
          class="px-4 py-2 rounded-full border text-sm transition-colors"
          [class.border-primary]="selectedDistance === 2"
          [class.bg-primary/10]="selectedDistance === 2"
          [class.text-primary]="selectedDistance === 2"
          [class.border-glass-stroke]="selectedDistance !== 2"
          [class.bg-transparent]="selectedDistance !== 2"
          (click)="onDistanceChange(2)"
        >
          2 km
        </button>

        <button
          type="button"
          class="px-4 py-2 rounded-full border text-sm transition-colors"
          [class.border-primary]="selectedDistance === 5"
          [class.bg-primary/10]="selectedDistance === 5"
          [class.text-primary]="selectedDistance === 5"
          [class.border-glass-stroke]="selectedDistance !== 5"
          [class.bg-transparent]="selectedDistance !== 5"
          (click)="onDistanceChange(5)"
        >
          5 km
        </button>

        <button
          type="button"
          class="px-4 py-2 rounded-full border text-sm transition-colors"
          [class.border-primary]="selectedDistance === 10"
          [class.bg-primary/10]="selectedDistance === 10"
          [class.text-primary]="selectedDistance === 10"
          [class.border-glass-stroke]="selectedDistance !== 10"
          [class.bg-transparent]="selectedDistance !== 10"
          (click)="onDistanceChange(10)"
        >
          10 km
        </button>

        <button
          type="button"
          class="px-4 py-2 rounded-full border text-sm transition-colors"
          [class.border-primary]="selectedDistance === 25"
          [class.bg-primary/10]="selectedDistance === 25"
          [class.text-primary]="selectedDistance === 25"
          [class.border-glass-stroke]="selectedDistance !== 25"
          [class.bg-transparent]="selectedDistance !== 25"
          (click)="onDistanceChange(25)"
        >
          25 km
        </button>
      </div>
    </div>

    <hr class="border-glass-stroke my-2" />

    <!-- Rating -->
    <div class="flex flex-col gap-3">
      <h3
        class="text-sm font-medium text-on-surface-variant uppercase tracking-wider"
      >
        Rating
      </h3>

      <div class="flex flex-col gap-2">
        <label class="flex items-center gap-3 cursor-pointer group">
<input
  class="form-radio text-primary bg-surface border-glass-stroke focus:ring-primary focus:ring-offset-0"
  name="rating"
  type="radio"
  [checked]="selectedRating === 4.5"
  (change)="onRatingChange(4.5)"
/>

          <span
            class="flex items-center gap-1 group-hover:text-primary transition-colors"
          >
            <span
              class="material-symbols-outlined text-tertiary text-sm"
              data-weight="fill"
            >
              star
            </span>

            <span>4.5 &amp; up</span>
          </span>
        </label>

        <label class="flex items-center gap-3 cursor-pointer group">
<input
  class="form-radio text-primary bg-surface border-glass-stroke focus:ring-primary focus:ring-offset-0"
  name="rating"
  type="radio"
  [checked]="selectedRating === 4"
  (change)="onRatingChange(4)"
/>

          <span
            class="flex items-center gap-1 group-hover:text-primary transition-colors"
          >
            <span
              class="material-symbols-outlined text-tertiary text-sm"
              data-weight="fill"
            >
              star
            </span>

            <span>4.0 &amp; up</span>
          </span>
        </label>
      </div>
    </div>

    <hr class="border-glass-stroke my-2" />

    <!-- Price Range -->
    <div class="space-y-3">
  <div class="flex items-center justify-between">
    <label class="text-sm font-medium text-on-surface">
      Price per Hour
    </label>

    <span class="text-sm text-primary font-medium">
      @if (selectedMaxHourlyRate === undefined) {
        Any
      } @else {
        Up to ₹{{ selectedMaxHourlyRate }}
      }
    </span>
  </div>

  <input
    class="w-full accent-primary h-1 bg-surface-variant rounded-lg appearance-none cursor-pointer"
    type="range"
    [min]="minPrice"
    [max]="maxPrice"
    [value]="selectedMaxHourlyRate ?? maxPrice"
    (input)="onMaxHourlyRateChange($any($event.target).value)"
  />

  <div class="flex justify-between text-xs text-on-surface-variant">
    <span>₹{{ minPrice }}</span>
    <span>₹{{ maxPrice }}+</span>
  </div>
</div>

    <hr class="border-glass-stroke my-2" />

    <!-- Availability -->
    <div class="flex flex-col gap-3">
      <h3
        class="text-sm font-medium text-on-surface-variant uppercase tracking-wider"
      >
        Availability
      </h3>

      <div class="flex flex-col gap-2">
        <label class="flex items-center gap-3 cursor-pointer">
          <input
            class="form-radio text-primary bg-surface border-glass-stroke focus:ring-primary focus:ring-offset-0"
            name="availability"
            type="radio"
            [checked]="selectedAvailability === 'today'"
            (change)="onAvailabilityChange('today')"
          />

          <span>Available Today</span>
        </label>

        <label class="flex items-center gap-3 cursor-pointer">
          <input
            class="form-radio text-primary bg-surface border-glass-stroke focus:ring-primary focus:ring-offset-0"
            name="availability"
            type="radio"
            [checked]="selectedAvailability === 'tomorrow'"
            (change)="onAvailabilityChange('tomorrow')"
          />

          <span>Available Tomorrow</span>
        </label>

        <label class="flex items-center gap-3 cursor-pointer">
          <input
            class="form-radio text-primary bg-surface border-glass-stroke focus:ring-primary focus:ring-offset-0"
            name="availability"
            type="radio"
            [checked]="selectedAvailability === 'thisWeek'"
            (change)="onAvailabilityChange('thisWeek')"
          />

          <span>Available This Week</span>
        </label>

        @if (selectedAvailability) {
          <button
            type="button"
            class="text-sm text-primary text-left hover:text-sky-blue transition-colors"
            (click)="clearAvailability()"
          >
            Clear availability
          </button>
        }
      </div>
    </div>

    <!-- Apply -->
    <button
      type="button"
      class="btn-primary w-full py-3 rounded-xl font-medium mt-auto"
      (click)="applyFilters()"
    >
      Apply Filters
    </button>
  </div>
</aside>
