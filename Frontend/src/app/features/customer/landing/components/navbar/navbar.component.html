<!-- Header / TopNavBar -->
<header
  class="fixed top-0 w-full z-50 bg-white/70 dark:bg-deep-navy/70 backdrop-blur-xl border-b border-black/5 dark:border-glass-stroke shadow-glow-sm transition-colors duration-500"
>
  <div class="flex justify-between items-center px-gutter py-4 max-w-container-max mx-auto">
    <div class="flex items-center gap-2">
      <span
        class="font-display-lg text-4xl font-bold text-royal-blue dark:text-primary tracking-tight"
        >Fixo</span
      >
    </div>
    <nav class="hidden md:flex items-center space-x-8">
      <a
        class="font-body-md text-royal-blue dark:text-primary font-bold border-b-2 border-royal-blue dark:border-primary pb-1 transition-colors duration-200"
        href="#"
        >Services</a
      >
      <a
        class="font-body-md text-on-surface-variant dark:text-on-surface-variant text-slate-600 hover:text-royal-blue dark:hover:text-primary transition-colors duration-200"
        href="#"
        >Reviews</a
      >
      <a
        class="font-body-md text-on-surface-variant dark:text-on-surface-variant text-slate-600 hover:text-royal-blue dark:hover:text-primary transition-colors duration-200"
        href="#"
        >About</a
      >
    </nav>
    <div class="flex items-center space-x-3">
      <div class="hidden lg:flex items-center space-x-2">
        <!-- Language Selector -->
        <button
          class="glass-card flex items-center gap-2 px-3 py-2 rounded-full hover:bg-white/10 dark:hover:bg-white/10 hover:bg-black/5 transition-all duration-300 group"
        >
          <span
            class="material-symbols-outlined text-on-surface-variant dark:text-on-surface-variant text-slate-600 group-hover:text-royal-blue dark:group-hover:text-primary transition-colors"
            >language</span
          >
          <span
            class="font-label-sm text-on-surface-variant dark:text-on-surface-variant text-slate-600 group-hover:text-on-surface dark:group-hover:text-on-surface group-hover:text-black"
            >EN</span
          >
        </button>
        <!-- Dark / Light Mode Toggle -->
        <button
          class="glass-card flex items-center justify-center w-10 h-10 rounded-full hover:bg-white/10 dark:hover:bg-white/10 hover:bg-black/5 transition-all duration-300 group"
          (click)="themeService.toggle()"
          aria-label="Toggle dark mode"
        >
          <span
            class="material-symbols-outlined text-on-surface-variant dark:text-on-surface-variant text-slate-600 group-hover:text-royal-blue dark:group-hover:text-primary transition-colors"
            >{{ themeService.theme() === 'dark' ? 'light_mode' : 'dark_mode' }}</span
          >
        </button>
      </div>
      <button
        class="btn-secondary px-6 py-2.5 rounded-full text-on-surface dark:text-on-surface text-slate-900 font-semibold text-body-md hover:scale-105 active:scale-95 transition-all"
      >
        Login / Sign Up</button
      ><button
        class="px-6 py-2.5 rounded-full text-white font-semibold text-body-md hover:scale-105 active:scale-95 transition-all bg-royal-blue inline-flex items-center justify-center"
      >
        Become a Tasker
      </button>
    </div>
  </div>
</header>
