<!-- How It Works -->
<section
  appScrollReveal
  class="py-section-gap relative overflow-hidden dark:bg-surface-container-lowest bg-slate-50"
>
  <div class="max-w-container-max mx-auto px-margin-mobile md:px-gutter">
    <div class="text-center mb-20">
      <span
        class="font-label-sm text-primary dark:text-primary text-royal-blue uppercase tracking-[0.2em] mb-4 block"
        >Process</span
      >
      <h2
        class="font-headline-lg text-headline-lg text-on-surface dark:text-on-surface text-slate-900"
      >
        Simple 3-Step Success
      </h2>
    </div>
    <div class="relative grid grid-cols-1 md:grid-cols-3 gap-12">
      <!-- Curved Lines (Desktop only) -->
      <svg
        class="hidden md:block absolute top-1/2 left-0 w-full -translate-y-1/2 z-0"
        fill="none"
        height="100"
        viewBox="0 0 1200 100"
      >
        <path
          d="M100 50 C 300 50, 300 50, 500 50 S 700 50, 900 50"
          stroke="url(#paint0_linear)"
          stroke-dasharray="8 8"
          stroke-width="2"
        ></path>
        <defs>
          <linearGradient
            gradientUnits="userSpaceOnUse"
            id="paint0_linear"
            x1="0"
            x2="1200"
            y1="50"
            y2="50"
          >
            <stop stop-color="#5e6ad2" stop-opacity="0"></stop>
            <stop offset="0.5" stop-color="#5e6ad2"></stop>
            <stop offset="1" stop-color="#5e6ad2" stop-opacity="0"></stop>
          </linearGradient>
        </defs>
      </svg>
      <!-- Step 1 -->
      <div class="relative z-10 text-center space-y-6 group">
        <div
          class="w-20 h-20 mx-auto rounded-full glass-card flex items-center justify-center text-2xl font-bold text-primary dark:text-primary text-royal-blue group-hover:scale-110 transition-transform"
        >
          01
        </div>
        <div class="glass-card p-8 rounded-3xl">
          <h4
            class="font-headline-lg text-[22px] mb-3 text-on-surface dark:text-on-surface text-slate-900"
          >
            Choose a Tasker
          </h4>
          <p
            class="font-body-md text-on-surface-variant dark:text-on-surface-variant text-slate-600"
          >
            Browse through verified profiles and read real customer reviews.
          </p>
        </div>
      </div>
      <!-- Step 2 -->
      <div class="relative z-10 text-center space-y-6 group">
        <div
          class="w-20 h-20 mx-auto rounded-full glass-card flex items-center justify-center text-2xl font-bold text-primary dark:text-primary text-royal-blue group-hover:scale-110 transition-transform"
        >
          02
        </div>
        <div class="glass-card p-8 rounded-3xl">
          <h4
            class="font-headline-lg text-[22px] mb-3 text-on-surface dark:text-on-surface text-slate-900"
          >
            Schedule Today
          </h4>
          <p
            class="font-body-md text-on-surface-variant dark:text-on-surface-variant text-slate-600"
          >
            Pick a time that works for you. Instant confirmation via app.
          </p>
        </div>
      </div>
      <!-- Step 3 -->
      <div class="relative z-10 text-center space-y-6 group">
        <div
          class="w-20 h-20 mx-auto rounded-full glass-card flex items-center justify-center text-2xl font-bold text-primary dark:text-primary text-royal-blue group-hover:scale-110 transition-transform"
        >
          03
        </div>
        <div class="glass-card p-8 rounded-3xl">
          <h4
            class="font-headline-lg text-[22px] mb-3 text-on-surface dark:text-on-surface text-slate-900"
          >
            Chat, Pay &amp; Review
          </h4>
          <p
            class="font-body-md text-on-surface-variant dark:text-on-surface-variant text-slate-600"
          >
            Seamless communication and secure digital payments on completion.
          </p>
        </div>
      </div>
    </div>
  </div>
</section>
