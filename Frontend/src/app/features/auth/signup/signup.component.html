<app-navbar></app-navbar>

<!-- Atmospheric Background -->
<div class="fixed inset-0 pointer-events-none z-0">
  <div
    class="absolute top-[-10%] right-[-5%] w-[500px] h-[500px] bg-primary/10 rounded-full blur-[120px]"
  ></div>
  <div
    class="absolute bottom-[-10%] left-[-5%] w-[600px] h-[600px] bg-royal-blue/5 rounded-full blur-[150px]"
  ></div>
</div>

<!-- Signup Content -->
<!-- Main Content -->
<main
  class="flex-1 flex items-center justify-center pt-32 pb-section-gap px-margin-mobile relative z-10"
>
  <div class="w-full max-w-[520px] animate-in fade-in slide-in-from-bottom-4 duration-700">
    <!-- Sign Up Card -->
    <div class="glass-card rounded-[20px] p-8 md:p-10 glow-shadow-primary">
      <div class="text-center mb-10">
        <h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">Create Account</h1>
        <p class="text-on-surface-variant font-body-md">
          Join Fixo to start booking premium home services.
        </p>
      </div>
      <form class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- First Name -->
          <div class="relative group">
            <span
              class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline transition-colors group-focus-within:text-primary"
              >person</span
            >
            <input
              class="w-full bg-surface-container-lowest border border-glass-stroke rounded-xl pl-12 pr-4 py-3.5 text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all"
              placeholder="First Name"
              type="text"
            />
          </div>
          <!-- Last Name -->
          <div class="relative group">
            <span
              class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline transition-colors group-focus-within:text-primary"
              >badge</span
            >
            <input
              class="w-full bg-surface-container-lowest border border-glass-stroke rounded-xl pl-12 pr-4 py-3.5 text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all"
              placeholder="Last Name"
              type="text"
            />
          </div>
        </div>
        <!-- Email Address -->
        <div class="relative group">
          <span
            class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline transition-colors group-focus-within:text-primary"
            >mail</span
          >
          <input
            class="w-full bg-surface-container-lowest border border-glass-stroke rounded-xl pl-12 pr-4 py-3.5 text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all"
            placeholder="Email Address"
            type="email"
          />
        </div>
        <!-- Phone Number -->
        <div class="relative group">
          <span
            class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline transition-colors group-focus-within:text-primary"
            >phone</span
          >
          <input
            class="w-full bg-surface-container-lowest border border-glass-stroke rounded-xl pl-12 pr-4 py-3.5 text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all"
            placeholder="Phone Number"
            type="tel"
          />
        </div>
        <!-- Password -->
        <div class="relative group">
          <span
            class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline transition-colors group-focus-within:text-primary"
            >lock</span
          >
          <input
            class="w-full bg-surface-container-lowest border border-glass-stroke rounded-xl pl-12 pr-4 py-3.5 text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all"
            placeholder="Password"
            type="password"
          />
        </div>
        <!-- Confirm Password -->
        <div class="relative group">
          <span
            class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline transition-colors group-focus-within:text-primary"
            >lock_clock</span
          >
          <input
            class="w-full bg-surface-container-lowest border border-glass-stroke rounded-xl pl-12 pr-4 py-3.5 text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all"
            placeholder="Confirm Password"
            type="password"
          />
        </div>
        <button
          class="w-full bg-gradient-primary text-white font-bold py-4 rounded-full hover:scale-[1.02] active:scale-[0.98] transition-all shadow-xl shadow-royal-blue/30 mt-2"
          type="submit"
        >
          Sign Up
        </button>
        <div class="relative py-4 flex items-center">
          <div class="flex-grow border-t border-glass-stroke"></div>
          <span class="shrink mx-4 text-outline font-label-sm uppercase">or join with</span>
          <div class="flex-grow border-t border-glass-stroke"></div>
        </div>
        <!-- Google Sign Up -->
        <button
          class="w-full bg-transparent border border-glass-stroke hover:bg-white/5 text-on-surface py-3.5 rounded-full flex items-center justify-center gap-3 transition-all"
          type="button"
        >
          <svg class="w-5 h-5" viewBox="0 0 24 24">
            <path
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
              fill="#4285F4"
            ></path>
            <path
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              fill="#34A853"
            ></path>
            <path
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
              fill="#FBBC05"
            ></path>
            <path
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 12-4.53z"
              fill="#EA4335"
            ></path>
          </svg>
          <span class="font-body-md">Continue with Google</span>
        </button>
      </form>
      <div class="mt-8 text-center">
        <p class="text-on-surface-variant">
          Already have an account?
          <a
            class="text-primary hover:text-sky-blue font-semibold transition-colors underline decoration-primary/30 underline-offset-4 ml-1"
            href="#"
            >Back to Login</a
          >
        </p>
      </div>
    </div>
  </div>
</main>
<app-footer></app-footer>
