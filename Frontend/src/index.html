<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">

  <title>Fixo — Book Local, Trusted Help</title>

  <base href="/">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="Find verified professionals for every household need. Fast booking, secure payments, and trusted reviews — all in one place."
  >

  <link
    rel="icon"
    type="image/x-icon"
    href="favicon.ico"
  >

  <!-- Google Fonts -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  >

  <!-- Material Symbols -->
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet"
  >

  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #121317;
    }

    /* ================================
       Fixo Initial Loader
       ================================ */

    #fixo-loader {
      position: fixed;
      inset: 0;
      z-index: 99999;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle at 50% 45%,
          rgba(94, 106, 210, 0.14),
          transparent 38%
        ),
        #121317;

      opacity: 1;
      visibility: visible;

      transition:
        opacity 350ms ease,
        visibility 350ms ease;
    }

    #fixo-loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .fixo-loader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    /* Fixo Logo */
    .fixo-loader-logo {
      font-family: 'Hanken Grotesk', sans-serif;

      font-size: 64px;
      font-weight: 700;
      letter-spacing: -0.06em;
      line-height: 1;

      color: #ffffff;

      text-shadow:
        0 0 25px rgba(124, 196, 250, 0.12),
        0 0 50px rgba(94, 106, 210, 0.18);
    }

    .fixo-loader-logo span {
      color: #7cc4fa;

      text-shadow:
        0 0 20px rgba(124, 196, 250, 0.65),
        0 0 45px rgba(94, 106, 210, 0.4);
    }

    /* Small Loader */
    .fixo-loader-spinner {
      width: 24px;
      height: 24px;

      border-radius: 50%;

      border: 2px solid rgba(255, 255, 255, 0.08);
      border-top-color: #7cc4fa;
      border-right-color: rgba(94, 106, 210, 0.8);

      animation: fixo-loader-spin 900ms linear infinite;

      filter:
        drop-shadow(
          0 0 6px rgba(124, 196, 250, 0.35)
        )
        drop-shadow(
          0 0 12px rgba(94, 106, 210, 0.2)
        );
    }

    @keyframes fixo-loader-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <!-- Initial Application Loader -->
  <div id="fixo-loader">

    <div class="fixo-loader-content">

      <div class="fixo-loader-logo">
        Fix<span>o</span>
      </div>

      <div class="fixo-loader-spinner"></div>

    </div>

  </div>

  <app-root></app-root>

  <script>
    (() => {
      const loader =
        document.getElementById('fixo-loader');

      if (!loader) {
        return;
      }

      const requiredFonts = [
        'Inter',
        'Hanken Grotesk',
        'JetBrains Mono',
        'Material Symbols Outlined'
      ];

      const waitForFonts = async () => {
        try {
          await Promise.all(
            requiredFonts.map((font) =>
              document.fonts.load(
                `16px "${font}"`
              )
            )
          );

          await document.fonts.ready;

        } catch (error) {
          console.warn(
            'Font loading completed with an issue:',
            error
          );
        }

        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            loader.classList.add('hidden');
          });
        });
      };

      waitForFonts();
    })();
  </script>

</body>
</html>
